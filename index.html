<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>foxgirls.org</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="assets/ionicons/ionicons.esm.js"></script>
    <script type="module" src="assets/ionicons/ionicons.js"></script>
</head>
<body class="bg">
<div class="preloader" id="preloader">
    <img src="assets/media/logo.png">
    <span class="loader"></span>
</div>
<div class="caticon" id="cat">
    <ion-icon name="cat"></ion-icon>
</div>
<div class="container">

    <h1>FOXGIRLS.ORG</h1>
    <span class="under">
        <ion-icon name="fence-caution"></ion-icon>
        Website under construction
        <ion-icon name="fence-caution"></ion-icon>
    </span>
    <div class="links">
        <a href="https://t.me/foxgirlsorg" class="iconlink" target="_blank">
            <ion-icon name="telegram"></ion-icon>
        </a>
        <a href="https://github.com/foxgirlsorg" class="iconlink" target="_blank">
            <ion-icon name="github"></ion-icon>
        </a>
        <a href="mailto:contact@foxgirls.org" class="iconlink">
            <ion-icon name="mail"></ion-icon>
        </a>
    </div>

</div>
<audio id="bgMusic" loop>
    <source src="assets/media/song.mp3x" type="audio/mpeg">
</audio>

</body>

<script>
    const music = document.getElementById('bgMusic');
    const cat = document.getElementById('cat');
    let isPlaying = false;
    let firstStart = true;

    cat.addEventListener('click', () => {
        if (!isPlaying) {
            if (firstStart) {
                music.currentTime = 39.5;
                firstStart = false;
            }
            music.volume = 1.0;
            music.play().then(() => {
                isPlaying = true;
            }).catch(() => {
            });
        } else {
            music.pause();
            isPlaying = false;
        }
    });

</script>


<script>
    window.addEventListener("load", (event) => {
        const preloader = document.getElementById('preloader');
        preloader.style.opacity = 0;
        setTimeout(() => {
            preloader.style.display = 'none';
        }, 500);

    });
</script>
</html>
